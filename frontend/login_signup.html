<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up - NeuroLearn</title>
    <link rel="stylesheet" href="login_signup.css">
</head>
<body>

    <div class="container">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Login</div>
            <div class="tab" onclick="switchTab('signup')">Sign Up</div>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="form-box active">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" required placeholder="test@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit">Login to NeuroLearn</button>
        </form>

        <!-- Sign Up Form -->
        <form id="signup-form" class="form-box">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" required placeholder="Dennis Wahura">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" required placeholder="test@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" required placeholder="••••••••">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit">Create Account</button>
        </form>
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-box').forEach(f => f.classList.remove('active'));
            
            if(tabName === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('signup-form').classList.add('active');
            }
        }
    </script>
</body>
</html>
