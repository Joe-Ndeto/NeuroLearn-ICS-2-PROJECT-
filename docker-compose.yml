services:

  mysql:
    image: mysql:8.4
    container_name: neurolearn-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: neurolearn_root
      MYSQL_DATABASE: neurolearn
      MYSQL_USER: neurolearn
      MYSQL_PASSWORD: neurolearn_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/mysql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - neurolearn-net

  neo4j:
    image: neo4j:2026.08.1
    container_name: neurolearn-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/neurolearn_password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - neurolearn-net

  backend:
    build: . 
    container_name: neurolearn-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=mysql
      - DB_USER=neurolearn
      - DB_PASSWORD=neurolearn_password
      - DB_NAME=neurolearn
      - DB_PORT=3306
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neurolearn_password
    depends_on:
      - mysql
      - neo4j
    networks:
      - neurolearn-net

volumes:
  mysql_data:
  neo4j_data:
  neo4j_logs:

networks:
  neurolearn-net:
    driver: bridge
